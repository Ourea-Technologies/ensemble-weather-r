name: Bug report
description: Something in the R package does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. A small, complete example helps us fix it fast.
        **Never paste your API key.** Security issue? Please do not file it here; see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal code to reproduce
      description: The smallest snippet that shows the problem. Leave the key out (use OUREA_API_KEY).
      render: r
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      description: The output of packageVersion("ensembleweather").
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: R version and OS
      description: For example "R 4.5.1 on Ubuntu 24.04" (sessionInfo() shows both).
    validations:
      required: true
  - type: input
    id: request-id
    attributes:
      label: Request id, if any
      description: From the error (cnd$request_id) or ew_response_info(result)$request_id.
  - type: textarea
    id: output
    attributes:
      label: Error message or output
      render: text
