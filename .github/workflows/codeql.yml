name: CodeQL

# CodeQL has no R extractor, so this analyses the workflows (the "actions"
# language) with security-extended; the R code is covered by the static
# security lint in security.yml.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "31 4 * * 2"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (actions)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: actions
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:actions
